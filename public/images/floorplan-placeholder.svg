  <rect x="500" y="315" width="100" height="130"
    fill="none" stroke="rgba(78,168,232,0.25)" stroke-width="0.6" stroke-dasharray="5 4"/>
  <text x="550" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(78,168,232,0.45)">HALL</text>

  <!-- dimension lines — gold -->
  <line x1="120" y1="726" x2="1020" y2="726" stroke="rgba(199,154,63,0.5)" stroke-width="0.7"/>
  <line x1="120" y1="720" x2="120" y2="732" stroke="rgba(199,154,63,0.5)" stroke-width="0.7"/>
