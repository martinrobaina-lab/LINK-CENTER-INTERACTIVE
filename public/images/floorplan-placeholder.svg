  <line x1="50" y1="100" x2="50" y2="700" stroke="rgba(199,154,63,0.5)" stroke-width="0.7"/>
  <line x1="44" y1="100" x2="56" y2="100" stroke="rgba(199,154,63,0.5)" stroke-width="0.7"/>
  <line x1="44" y1="700" x2="56" y2="700" stroke="rgba(199,154,63,0.5)" stroke-width="0.7"/>
