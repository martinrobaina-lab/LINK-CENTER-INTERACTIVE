<svg viewBox="0 0 1100 760" width="1100" height="760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent — lets the tower photo behind the panel show through -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(199,154,63,0.08)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1100" height="760" fill="url(#grid)"/>

  <!-- outer trapezoidal boundary — gold glow -->
  <polygon points="120,100 980,60 1020,680 80,700"
    fill="rgba(199,154,63,0.05)"
    stroke="#c79a3f" stroke-width="1.5"
    filter="url(#glow)"/>

  <!-- inner dashed offset -->
  <polygon points="132,110 968,71 1008,668 92,688"
    fill="none"
    stroke="rgba(199,154,63,0.35)" stroke-width="0.6"
    stroke-dasharray="8 5"/>

  <!-- left core -->
  <rect x="370" y="270" width="130" height="220"
    fill="rgba(100,180,255,0.04)" stroke="#4ea8e8" stroke-width="1.2"
    filter="url(#glow)"/>

  <!-- elevator shafts left -->
  <rect x="375" y="275" width="55" height="80"
    fill="rgba(100,180,255,0.08)" stroke="#4ea8e8" stroke-width="0.9"/>
  <rect x="438" y="275" width="55" height="80"
    fill="rgba(100,180,255,0.08)" stroke="#4ea8e8" stroke-width="0.9"/>
  <line x1="375" y1="275" x2="430" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>
  <line x1="430" y1="275" x2="375" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>
  <line x1="438" y1="275" x2="493" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>
  <line x1="493" y1="275" x2="438" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>

  <!-- stair left -->
  <rect x="375" y="365" width="118" height="60"
    fill="rgba(100,180,255,0.04)" stroke="#4ea8e8" stroke-width="0.8"/>
  <line x1="375" y1="374" x2="493" y2="374" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="375" y1="383" x2="493" y2="383" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="375" y1="392" x2="493" y2="392" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="375" y1="401" x2="493" y2="401" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="375" y1="410" x2="493" y2="410" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="375" y1="419" x2="493" y2="419" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>

