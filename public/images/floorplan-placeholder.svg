  <rect x="605" y="365" width="118" height="60"
    fill="rgba(100,180,255,0.04)" stroke="#4ea8e8" stroke-width="0.8"/>
  <line x1="605" y1="374" x2="723" y2="374" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="605" y1="383" x2="723" y2="383" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="605" y1="392" x2="723" y2="392" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="605" y1="401" x2="723" y2="401" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="605" y1="410" x2="723" y2="410" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <line x1="605" y1="419" x2="723" y2="419" stroke="rgba(78,168,232,0.35)" stroke-width="0.6"/>
  <rect x="605" y="435" width="118" height="48"
    fill="rgba(100,180,255,0.04)" stroke="#4ea8e8" stroke-width="0.8"/>
  <text x="664" y="463" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(78,168,232,0.6)">SS</text>

