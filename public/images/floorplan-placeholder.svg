  <!-- north arrow — gold glow -->
  <g transform="translate(62,145)" filter="url(#glow)">
    <polygon points="0,-20 5,18 0,10 -5,18" fill="#c79a3f" stroke="none"/>
    <polygon points="0,-20 -5,18 0,10" fill="rgba(199,154,63,0.3)" stroke="#c79a3f" stroke-width="0.6"/>
    <text x="0" y="32" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#c79a3f">N</text>
  </g>

  <!-- scale bar -->
  <g transform="translate(820,706)">
    <rect x="0" y="0" width="40" height="6" fill="#4ea8e8" opacity="0.7"/>
    <rect x="40" y="0" width="40" height="6" fill="none" stroke="#4ea8e8" stroke-width="0.7" opacity="0.7"/>
    <rect x="80" y="0" width="40" height="6" fill="#4ea8e8" opacity="0.7"/>
    <text x="0" y="20" font-family="monospace" font-size="9" fill="rgba(78,168,232,0.6)">0</text>
    <text x="36" y="20" font-family="monospace" font-size="9" fill="rgba(78,168,232,0.6)">5</text>
    <text x="76" y="20" font-family="monospace" font-size="9" fill="rgba(78,168,232,0.6)">10 m</text>
  </g>

  <!-- title block — gold border -->
  <rect x="790" y="56" width="230" height="106"
    fill="rgba(11,14,26,0.85)" stroke="rgba(199,154,63,0.6)" stroke-width="1"
    filter="url(#glow)"/>
  <text x="905" y="76" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="3" fill="rgba(199,154,63,0.7)">LINK CENTER</text>
  <line x1="800" y1="82" x2="1010" y2="82" stroke="rgba(199,154,63,0.4)" stroke-width="0.7"/>
  <text x="905" y="100" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#c79a3f" filter="url(#glow)">TORRE CORPORATIVA</text>
  <text x="905" y="116" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(199,154,63,0.6)">Planta Tipo · 1.400 m²</text>
  <text x="905" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(199,154,63,0.4)">Nivel ___ · Gómez Platero Arq.</text>
  <text x="905" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(199,154,63,0.35)">Escala 1:200</text>

  <!-- zone labels -->
  <text x="245" y="392" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(78,168,232,0.55)">OFICINAS</text>
  <text x="245" y="407" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(78,168,232,0.35)">PLANTA LIBRE</text>

  <text x="870" y="440" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(78,168,232,0.55)">OFICINAS</text>
  <text x="870" y="455" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(78,168,232,0.35)">PLANTA LIBRE</text>

  <text x="550" y="192" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(199,154,63,0.4)">TERRAZA / CIRCULACIÓN</text>
  <text x="550" y="610" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(199,154,63,0.4)">TERRAZA / CIRCULACIÓN</text>
</svg>
