  <line x1="660" y1="275" x2="605" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>
  <line x1="668" y1="275" x2="723" y2="355" stroke="rgba(78,168,232,0.4)" stroke-width="0.7"/>
